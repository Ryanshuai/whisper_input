[workspace]
name = "whisper-writer"
version = "0.1.0"
description = "Minimal whisper voice input tool"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = ">=3.11,<3.12"
numpy = "*"
pyyaml = "*"
cffi = "*"
onnxruntime = "*"
pynput = "*"
pyperclip = "*"
setuptools = ">=70,<81"
ffmpeg = "*"
portaudio = ">=19.7.0,<20"

[target.win-64.dependencies]
vc = "*"
vs2015_runtime = "*"

# conda-forge 上没有的包才放这里
[pypi-dependencies]
sounddevice = "*"
ctranslate2 = ">=4.5,<4.8"
faster-whisper = "*"
silero-vad = "*"
edge-tts = "*"
# qwen-tts 移除：它死钉 transformers==4.57.3，挡住 Qwen3-ASR 需要的 transformers 5.x。
# 本地 Qwen3-TTS 在 RTX 5080 上 3-15s/句本就不实用，日常用 edge TTS。tts.py 的 qwen3 TTS
# 懒加载路径随之失效（tts_backend=qwen3 时才触发）；要恢复需单独装兼容的 qwen-tts。
# qwen-tts = "*"
# torch 必须从 cu128 index 装才支持 Blackwell (RTX 50 系列)；qwen-tts 默认拉的是 CPU 版
torch = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
soundfile = "*"           # numpy → WAV bytes
soxr = "*"                # 高质量重采样(conda 的 soxr 只是 C 库,import soxr 需 PyPI wheel)
claude-agent-sdk = "*"
tokenizers = "*"          # 轻量 Rust tokenizer，避免拉 torch
huggingface-hub = "*"     # model download
transformers = ">=5.13"   # Qwen3-ASR backend（qwen3_asr 模型在 transformers 5.x 才有；懒加载，不影响 faster-whisper 路径）
accelerate = "*"          # transformers device_map / from_pretrained 加速加载

[tasks]
start = { cmd = "python main.py", env = { KMP_DUPLICATE_LIB_OK = "TRUE" } }
